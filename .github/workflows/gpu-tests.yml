name: GPU pipeline validation

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/gpu-tests.yml'
  pull_request:

permissions:
  contents: read

jobs:
  opencl-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      HDR_TEST_OPENCL_DEVICE: '0.0'
      POCL_MAX_PTHREAD_COUNT: '4'
    steps:
      - uses: actions/checkout@v5
      - name: Archive exact source revision
        run: git archive --format=zip HEAD -o hdr-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-pipeline-source
          path: hdr-source.zip
          retention-days: 7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install software OpenCL and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg pocl-opencl-icd
          python -m pip install PyQt5 numpy opencv-python-headless
          ffmpeg -hide_banner -filters | grep program_opencl
      - name: Execute regression and OpenCL parity tests
        run: python -m unittest discover -s tests -v
