name: Legacy FFmpeg float transport

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/legacy-float-tests.yml'
  pull_request:

permissions:
  contents: read

jobs:
  legacy-row-copy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      HDR_EXPECT_LEGACY_FLOAT_MERGE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install legacy FFmpeg for isolated row-copy reproduction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy
          ffmpeg -version
      # FFmpeg 4.4 does not support the grayf32le OpenCL download required by
      # this app. Test the actual merge bug here, not an unsupported GPU path.
      - name: Reproduce the original defect and verify lossless reassembly
        run: python -m unittest discover -s tests -p 'test_gpu_float_transport.py' -v

  legacy-opencl:
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      HDR_TEST_OPENCL_DEVICE: '0.0'
      HDR_EXPECT_LEGACY_FLOAT_MERGE: '1'
      POCL_MAX_PTHREAD_COUNT: '4'
    steps:
      - name: Install FFmpeg 5.1 and software OpenCL
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates ffmpeg pocl-opencl-icd python3 python3-numpy python3-pyqt5 python3-opencv
          ffmpeg -version
      - uses: actions/checkout@v5
      - name: Reproduce row-copy loss and validate the complete OpenCL pipeline
        run: python3 -m unittest discover -s tests -v
