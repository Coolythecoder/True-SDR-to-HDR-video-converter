name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      HDR_SCREENSHOT_DIR: ui_artifacts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install PyQt5 numpy opencv-python-headless
      - name: Ensure FFmpeg for Linux colour-pipeline tests
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -filters | grep zscale
          ffmpeg -hide_banner -filters | grep geq
          ffmpeg -hide_banner -filters | grep tonemap
          ffmpeg -hide_banner -encoders | grep libx265
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Verify application imports
        run: python -c "import SDR_to_HDR_cross_platform; import creative_hdr_ui; import preview_widget; import workspace_ui"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Save rendered workspace screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: live-preview-workspace
          path: ui_artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
