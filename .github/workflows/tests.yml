name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install PyQt5 numpy opencv-python-headless
      - name: Compile Python sources
        run: python -m compileall -q SDR_to_HDR_cross_platform.py conversion_paths.py tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
