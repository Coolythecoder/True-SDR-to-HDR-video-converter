name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install PyQt5 numpy opencv-python-headless
      - name: Ensure FFmpeg for Linux colour-pipeline tests
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -filters | grep zscale
          ffmpeg -hide_banner -encoders | grep libx265
      - name: Compile Python sources
        run: python -m compileall -q SDR_to_HDR_cross_platform.py conversion_paths.py hdr_processing.py youtube_hdr_export.py youtube_export_analysis.py tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
